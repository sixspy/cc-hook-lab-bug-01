<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>事件队列 · 投递台</title>
  <link rel="stylesheet" href="/styles.css"/>
  <script src="/common.js"></script>
</head>
<body>
<div id="filt-chip" class="chip" data-title="订阅过滤">过滤器凭证读取中</div>

<header class="顶栏">
    <div class="牌">投递台</div>
    <nav>
      <a href="/">投递台</a>
      <a href="/端点名册.html">端点名册</a>
      <a href="/事件队列.html" class="亮">事件队列</a>
      <a href="/投递流水.html">投递流水</a>
      <a href="/死信匣.html">死信匣</a>
      <a href="/签名规.html">签名规</a>
      <a href="/投递互证.html">投递互证</a>
      <a href="/事件详情.html">事件详情</a>
    </nav>
    <button class="按钮 次" type="button" onclick="fetch('/api/登出',{method:'POST'}).then(()=>location.href='/login')">退出</button>
  </header>
  <main class="主区">
    <header class="页头">
      <h1>事件队列详情</h1>
      <p>非法过滤器不再 except: pass 后恒真；拒收留独立凭证，短路脏账会在对账中现形。</p>
    </header>

<section class="卷">
  <label>事件类型</label><input id="事件类型" placeholder="例如 invoice.paid"/>
  <label>端点键</label><input id="端点键" placeholder="ep-billing" value="ep-billing"/>
  <label>载荷摘要</label><input id="载荷摘要" placeholder="key=value"/>
  <label>优先级</label><select id="优先级"><option>紧急</option><option selected>普通</option><option>低</option></select>
  <label>本次过滤器表达式（可选；默认读端点已钉版表达式）</label>
  <input id="过滤器" placeholder='非法示例：raise ValueError("bad")'/>
  <p class="消息" id="消息"></p>
  <button class="按钮" type="button" id="入队钮">入队（待投）</button>
  <button class="按钮 次" type="button" id="夹具钮">灌夹具样例</button>
  <label style="display:inline-block;margin-left:12px;"><input type="checkbox" id="合法仅" style="width:auto;max-width:none;"/> 只看合法凭证读集</label>
</section>
<section class="卷">
  <button class="按钮 次" type="button" id="对账钮">事件队列对账</button>
  <pre id="对账出" class="说明"></pre>
</section>
<section class="卷"><div class="表绕"><table><thead><tr><th>事件号</th><th>事件类型</th><th>端点键</th><th>载荷摘要</th><th>状态</th><th>过滤账实/指纹</th></tr></thead><tbody id="表"></tbody></table></div></section>

  </main>

<script>
async function 刷表() {
  const legalOnly = document.getElementById('合法仅').checked;
  const url = legalOnly ? '/api/事件?view=legal' : '/api/事件';
  const rows = await 投递台.getJSON(url);
  const tb = document.getElementById('表'); tb.innerHTML='';
  for (const r of rows) {
    const tr = 投递台.行('<td></td><td></td><td></td><td></td><td></td><td></td>');
    if (r.合法入账 === false) tr.className = '脏账行';
    const link = document.createElement('a');
    link.href = '/事件详情.html?事件号=' + encodeURIComponent(r.事件号);
    link.textContent = r.事件号;
    tr.children[0].appendChild(link);
    tr.children[1].textContent = r.事件类型;
    tr.children[2].textContent = r.端点键;
    tr.children[3].textContent = r.载荷摘要;
    tr.children[4].appendChild(投递台.徽章(r.状态));
    const box = document.createElement('div');
    box.appendChild(投递台.账实徽章(r));
    const fp = document.createElement('div'); fp.className = '指纹';
    fp.textContent = r.过滤指纹 ? String(r.过滤指纹).slice(0, 24) : '无指纹';
    box.appendChild(fp);
    tr.children[5].appendChild(box);
    tb.appendChild(tr);
  }
}
document.getElementById('入队钮').onclick = async () => {
  const 消息 = document.getElementById('消息');
  消息.style.color = '';
  try {
    await 投递台.postJSON('/api/事件/入队', {
      事件类型: document.getElementById('事件类型').value,
      端点键: document.getElementById('端点键').value,
      载荷摘要: document.getElementById('载荷摘要').value,
      优先级: document.getElementById('优先级').value,
      过滤器: document.getElementById('过滤器').value,
    });
    消息.textContent = '已入队，状态待投，过滤凭证已钉版';
    await 刷表();
  } catch (e) {
    消息.style.color = 'var(--险)';
    消息.textContent = '已拒绝/未入待投：' + e.message;
    await 刷表();
  }
};
document.getElementById('夹具钮').onclick = async () => {
  try {
    await 投递台.postJSON('/api/夹具入队/批量事件样例', {});
    await 刷表();
  } catch (e) { document.getElementById('消息').textContent = e.message; }
};
document.getElementById('合法仅').onchange = 刷表;
document.getElementById('对账钮').onclick = async () => {
  const out = document.getElementById('对账出');
  try {
    const rep = await 投递台.postJSON('/api/互证/跑', {});
    out.textContent = JSON.stringify(rep, null, 2);
    await 刷表();
    await 投递台.刷新过滤芯片();
  } catch (e) { out.textContent = e.message; }
};
刷表();
</script>

</body>
</html>
