<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>端点名册 · 投递台</title>
  <link rel="stylesheet" href="/styles.css"/>
  <script src="/common.js"></script>
</head>
<body>
<div id="filt-chip" class="chip" data-title="订阅过滤">过滤器凭证读取中</div>

<header class="顶栏">
    <div class="牌">投递台</div>
    <nav>
      <a href="/">投递台</a>
      <a href="/端点名册.html" class="亮">端点名册</a>
      <a href="/事件队列.html">事件队列</a>
      <a href="/投递流水.html">投递流水</a>
      <a href="/死信匣.html">死信匣</a>
      <a href="/签名规.html">签名规</a>
      <a href="/投递互证.html">投递互证</a>
      <a href="/事件详情.html">事件详情</a>
    </nav>
    <button class="按钮 次" type="button" onclick="fetch('/api/登出',{method:'POST'}).then(()=>location.href='/login')">退出</button>
  </header>
  <main class="主区">
    <header class="页头">
      <h1>端点名册列表</h1>
      <p>Webhook 投递控制台 · 订阅过滤器必须有解析状态与指纹；非法表达式不得显示为“过滤已生效”。</p>
    </header>

<section class="卷">
  <h2>登记端点</h2>
  <label>端点键</label><input id="端点键" placeholder="ep-new"/>
  <label>名称</label><input id="名称"/>
  <label>回调URL</label><input id="回调URL" placeholder="https://..."/>
  <label>密钥版本</label><input id="密钥版本" value="v1"/>
  <label>订阅过滤表达式（可留空；非法表达式会落为“解析失败”，入队 fail-closed）</label>
  <input id="过滤表达式" placeholder='事件类型 == "invoice.paid"'/>
  <p class="消息" id="消息"></p>
  <button class="按钮" type="button" id="登记">登记端点</button>
</section>
<section class="卷">
  <h2>名册与过滤器指纹</h2>
  <div class="表绕"><table><thead><tr><th>端点键</th><th>名称</th><th>回调URL</th><th>密钥版本</th><th>启用</th><th>过滤器</th><th>指纹/版本</th><th>操作</th></tr></thead><tbody id="表"></tbody></table></div>
</section>

  </main>

<script>
async function 刷表() {
  const rows = await 投递台.getJSON('/api/端点');
  const tb = document.getElementById('表'); tb.innerHTML='';
  for (const r of rows) {
    const tr = 投递台.行('<td></td><td></td><td></td><td></td><td></td><td></td><td></td><td></td>');
    tr.children[0].textContent = r.端点键;
    tr.children[1].textContent = r.名称;
    tr.children[2].textContent = r.回调URL;
    tr.children[3].textContent = r.密钥版本;
    tr.children[4].appendChild(投递台.徽章(r.启用 ? '启用' : '停用'));

    const filterText = r.过滤表达式 || (r.说明 || '');
    tr.children[5].innerHTML = '<div class="说明"></div>';
    tr.children[5].firstChild.textContent = filterText || '未设置（策略性全放行）';
    const state = r.过滤态 || '未设置';
    tr.children[5].appendChild(投递台.徽章(state === '有效' ? '已校验准入' : state));

    tr.children[6].innerHTML = '<div class="指纹"></div><div></div>';
    tr.children[6].children[0].textContent = r.过滤指纹 ? String(r.过滤指纹).slice(0, 20) : '无独立指纹';
    tr.children[6].children[1].textContent = 'v' + (r.过滤版本 || 0) + ' · cutover_book';

    const actions = document.createElement('div');
    const toggle = document.createElement('button'); toggle.className='按钮 次'; toggle.type='button';
    toggle.textContent = r.启用 ? '停用' : '启用';
    toggle.onclick = async () => { await 投递台.postJSON('/api/端点/启用', {端点键:r.端点键, 启用: !r.启用}); await 刷表(); };
    const editFilter = document.createElement('button'); editFilter.className='按钮'; editFilter.type='button';
    editFilter.textContent = '改过滤器';
    editFilter.style.marginLeft = '6px';
    editFilter.onclick = async () => {
      const expr = window.prompt('写入订阅过滤表达式；非法表达式会被标记为解析失败并在入队时拒绝', r.过滤表达式 || '');
      if (expr === null) return;
      try {
        await 投递台.postJSON('/api/端点/过滤器', {端点键:r.端点键, 过滤表达式: expr});
        document.getElementById('消息').textContent = '过滤器指纹已钉版';
        await 刷表();
        await 投递台.刷新过滤芯片();
      } catch (e) { document.getElementById('消息').textContent = e.message; }
    };
    actions.append(toggle, editFilter);
    tr.children[7].appendChild(actions);
    tb.appendChild(tr);
  }
}
document.getElementById('登记').onclick = async () => {
  const 消息 = document.getElementById('消息');
  try {
    await 投递台.postJSON('/api/端点', {
      端点键: document.getElementById('端点键').value,
      名称: document.getElementById('名称').value,
      回调URL: document.getElementById('回调URL').value,
      密钥版本: document.getElementById('密钥版本').value,
      过滤表达式: document.getElementById('过滤表达式').value,
    });
    消息.textContent = '已登记，过滤器凭证已落台';
    await 刷表();
    await 投递台.刷新过滤芯片();
  } catch (e) { 消息.textContent = e.message; }
};
刷表();
</script>

</body>
</html>
