<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>死信匣 · 投递台</title>
  <link rel="stylesheet" href="/styles.css"/>
  <script src="/common.js"></script>
</head>
<body>
<div id="filt-chip" class="chip" data-title="订阅过滤">过滤器凭证读取中</div>

<header class="顶栏">
    <div class="牌">投递台</div>
    <nav>
      <a href="/">投递台</a>
      <a href="/端点名册.html">端点名册</a>
      <a href="/事件队列.html">事件队列</a>
      <a href="/投递流水.html">投递流水</a>
      <a href="/死信匣.html" class="亮">死信匣</a>
      <a href="/签名规.html">签名规</a>
      <a href="/投递互证.html">投递互证</a>
      <a href="/事件详情.html">事件详情</a>
    </nav>
    <button class="按钮 次" type="button" onclick="fetch('/api/登出',{method:'POST'}).then(()=>location.href='/login')">退出</button>
  </header>
  <main class="主区">
    <header class="页头">
      <h1>死信匣目录</h1>
      <p>重试耗尽的合法入队事件进入此匣；短路脏账不得借死信重投洗白，重投仍回同一事件命运。</p>
    </header>

<section class="卷">
  <label>事件号</label><input id="事件号"/>
  <p class="消息" id="消息"></p>
  <button class="按钮" type="button" id="重投钮">死信重投</button>
  <button class="按钮 次" type="button" id="作废钮">作废</button>
</section>
<section class="卷"><div class="表绕"><table><thead><tr><th>死信号</th><th>事件号</th><th>端点键</th><th>失败次数</th><th>末次原因</th><th>状态</th><th>过滤账实/指纹</th></tr></thead><tbody id="表"></tbody></table></div></section>

  </main>

<script>
async function 刷表() {
  const rows = await 投递台.getJSON('/api/死信');
  const tb = document.getElementById('表'); tb.innerHTML='';
  for (const r of rows) {
    const tr = 投递台.行('<td></td><td></td><td></td><td></td><td></td><td></td><td></td>');
    tr.children[0].textContent = r.死信号;
    const a = document.createElement('a');
    a.href = '/事件详情.html?事件号=' + encodeURIComponent(r.事件号);
    a.textContent = r.事件号;
    tr.children[1].appendChild(a);
    tr.children[2].textContent = r.端点键;
    tr.children[3].textContent = r.失败次数;
    tr.children[4].textContent = r.末次原因;
    tr.children[5].appendChild(投递台.徽章(r.状态));
    const box = document.createElement('div');
    box.appendChild(投递台.账实徽章(r));
    const fp = document.createElement('div'); fp.className = '指纹';
    fp.textContent = r.过滤指纹 ? String(r.过滤指纹).slice(0, 24) : '无指纹';
    box.appendChild(fp);
    tr.children[6].appendChild(box);
    if (r.合法入账 === false) tr.className = '脏账行';
    tb.appendChild(tr);
  }
}
document.getElementById('重投钮').onclick = async () => {
  try {
    const rep = await 投递台.postJSON('/api/死信/重投', {事件号: document.getElementById('事件号').value});
    document.getElementById('消息').textContent = JSON.stringify(rep);
    await 刷表();
  } catch (e) { document.getElementById('消息').textContent = e.message; }
};
document.getElementById('作废钮').onclick = async () => {
  try {
    const rep = await 投递台.postJSON('/api/死信/作废', {事件号: document.getElementById('事件号').value});
    document.getElementById('消息').textContent = JSON.stringify(rep);
    await 刷表();
  } catch (e) { document.getElementById('消息').textContent = e.message; }
};
刷表();
</script>

</body>
</html>
